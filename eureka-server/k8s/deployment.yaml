apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: leonkenn/eureka-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
spec:
  type: NodePort
  selector:
    app: eureka-server
  ports:
    #Для REST сервиса.
    - name: rest
      port: 8080
      protocol: TCP
      targetPort: 8080
      nodePort: 30117

    #Для gRPC сервиса.
    - name: grpc
      port: 9090
      protocol: TCP
      targetPort: 9090
      nodePort: 30217


